<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zenithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background circle soft glow -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" />
  
  <!-- Zen-like circle ring with open breathing gap -->
  <path d="M 50,14 A 36,36 0 1,1 22,28" 
        stroke="url(#zenithGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        fill="none" />
        
  <!-- Subtle Zen accent dot representing mindfulness -->
  <circle cx="22" cy="28" r="4" fill="#38bdf8" />

  <!-- Clock hands with modern rounded ends -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="68" y2="50" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />
  
  <!-- Center pivot -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
